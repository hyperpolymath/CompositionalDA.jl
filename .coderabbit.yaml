# SPDX-License-Identifier: MPL-2.0
# CodeRabbit configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # No "review skipped" status comments, such as "Draft PR not reviewed".
  review_status: false
  # No poem and no in-progress "fortune" lines in the review summary.
  poem: false
  in_progress_fortune: false
  # Review-only: no generated commits or pull requests.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
# No automatic "Issue Planner" comments on new issues.
issue_enrichment:
  auto_enrich:
    enabled: false
