name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
  proofs:
    name: Agda proofs (2.7.0.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGDA_SHA256: 975b515a14877ab6bce5bfc641e16c4a3ee52ca5d7f846577dee80aa2145db8a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Agda release binary
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/agda.tar.xz" \
            https://github.com/agda/agda/releases/download/v2.7.0.1/Agda-v2.7.0.1-linux.tar.xz
          echo "${AGDA_SHA256}  $RUNNER_TEMP/agda.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/agda.tar.xz" -C "$RUNNER_TEMP"
          echo "Agda_datadir=$RUNNER_TEMP/Agda-v2.7.0.1/data" >> "$GITHUB_ENV"
          echo "AGDA_BIN=$RUNNER_TEMP/Agda-v2.7.0.1/bin/agda" >> "$GITHUB_ENV"
      - name: Type-check and axiom audit
        run: proofs/bootstrap.sh
      - name: Gate self-test (the gate must reject planted defects)
        run: proofs/tests/gate-selftest.sh
  oracle:
    name: R reference oracle (R 4.5.0, Bioconductor 3.22)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-lib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .r-lib
          key: r-4.5.0-bioc-3.22-oracle-v1
      - name: Install the Bioconductor 3.22 references
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'options(Ncpus = 4, timeout = 3600)
            if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
            BiocManager::install(version = "3.22", ask = FALSE, update = FALSE)
            for (p in c("ALDEx2")) if (!requireNamespace(p, quietly = TRUE)) BiocManager::install(p, ask = FALSE, update = FALSE)
            for (p in c("ALDEx2")) cat(p, as.character(packageVersion(p)), "\n")'
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Native vs reference agreement
        run: |
          export R_HOME="$(R RHOME)"
          julia --project=test/oracle -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
          julia --project=test/oracle test/oracle/runoracle.jl
