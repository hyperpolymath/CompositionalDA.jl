#
# Agda CICD gate pulled from the estate CICD-WORKFLOW-CATALOG.md
# (catalog entry: echidna-verify.yml — ECHIDNA trust-pipeline proof verification,
# Agda/Idris2; reusable = Yes; source = hyperpolymath/standards).
# See .github/workflows/ci.yml `proofs` job for the repo-specific proof gate
# (`proofs/check.sh`, `proofs/agda/`); this gate ensures the catalogue entry
# is present and checked as the repo extends.

name: Agda CICD Gate (catalogue)

on:
  push:
    branches: [main, arena/*]
    paths:
      - 'proofs/**'
      - '.github/workflows/agda-cicd.yml'
  pull_request:
    paths:
      - 'proofs/**'
      - '.github/workflows/agda-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agda-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-gate:
    name: Agda — catalogue gate (echidna-verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Reusable workflow from the estate standards repo (catalog entry:
    # echidna-verify.yml — ECHIDNA trust-pipeline proof verification, Agda/Idris2;
    # reusable = Yes). It checks `lol/proofs/` and `2-protocols/avow/`; the repo's
    # own proof corpus (`proofs/agda/`) is covered by `.github/workflows/ci.yml`
    # (`proofs/check.sh`). This gate ensures the catalogue entry is present
    # and checked as the repo extends.
    uses: hyperpolymath/standards/.github/workflows/echidna-verify.yml@main
